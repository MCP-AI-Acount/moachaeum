<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>모아채움</title>
  <!--
    Unity WebGL 빌드 시에만 이 파일의 템플릿 매크로가 실제 값으로 치환됩니다. 배포는 빌드 출력 index.html + Build 폴더를 사용하세요.
    주석 안에는 삼중 중괄호 매크로 문법을 쓰지 마세요. 전처리기가 빈 식으로 인식해 빌드가 실패합니다.
  -->
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      position: fixed;
      left: 0;
      top: 0;
      background: #000;
      touch-action: none;
      -webkit-touch-callout: none;
    }
    #unity-rotate-wrap {
      width: 100%;
      height: 100%;
      position: fixed;
      left: 0;
      top: 0;
      z-index: 0;
      touch-action: none;
      pointer-events: auto;
      -webkit-tap-highlight-color: transparent;
    }
    #unity-container {
      width: 100%;
      height: 100%;
      position: fixed;
      left: 0;
      top: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
      pointer-events: auto;
    }
    #unity-canvas {
      display: block;
      touch-action: none;
      outline: none;
      pointer-events: auto;
      width: min(100vw, calc(100vh * 16 / 9));
      height: min(100vh, calc(100vw * 9 / 16));
      max-width: 100vw;
      max-height: 100vh;
    }
    body.layout-css90 #unity-rotate-wrap {
      position: fixed;
      left: 50%;
      top: 50%;
      right: auto;
      bottom: auto;
      margin: 0;
      flex-shrink: 0;
      transform: translate(-50%, -50%) translateZ(0) rotate(var(--unity-rot, -90deg));
      transform-origin: center center;
      will-change: transform;
      pointer-events: auto;
    }
    body.layout-css90 #unity-container {
      width: 100%;
      height: 100%;
      position: relative;
      left: auto;
      top: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: auto;
    }
    body.layout-css90 #unity-canvas {
      box-sizing: border-box;
      pointer-events: auto;
    }
    #rotate-hint {
      display: none;
      position: fixed;
      left: 0;
      right: 0;
      bottom: 12px;
      text-align: center;
      font-family: system-ui, sans-serif;
      font-size: 14px;
      color: rgba(255,255,255,0.85);
      pointer-events: none;
      z-index: 1;
    }
    body.layout-css90 #rotate-hint {
      display: none;
    }
    #tap-landscape-gate {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 2147483646;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 16px;
      padding: 24px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      box-sizing: border-box;
      background: rgba(0,0,0,0.72);
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      text-align: center;
      touch-action: manipulation;
      pointer-events: auto;
    }
    #tap-landscape-gate.visible {
      display: flex;
      cursor: pointer;
      outline: none;
    }
    #tap-landscape-gate.visible:focus-visible {
      box-shadow: inset 0 0 0 3px rgba(255,255,255,0.35);
    }
    #tap-landscape-gate .gate-lead {
      font-size: 20px;
      font-weight: 600;
      max-width: 300px;
      line-height: 1.35;
    }
    #tap-landscape-gate .sub {
      font-size: 15px;
      opacity: 0.9;
      max-width: 300px;
      line-height: 1.5;
    }
    #tap-landscape-gate .gate-tap-hint {
      font-size: 14px;
      opacity: 0.65;
      margin-top: 8px;
      letter-spacing: 0.02em;
    }
  </style>
</head>
<body>
  <div id="unity-rotate-wrap">
    <div id="unity-container">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
    </div>
  </div>
  <div id="rotate-hint">가로로 보려면 기기를 돌리거나, 안내 화면에서 화면을 한 번 눌러 주세요</div>
  <!-- MobilePortraitWebGL: full-screen tap gate (#tap-landscape-gate). 산출물에 없으면 다른 템플릿으로 빌드된 것입니다. -->
  <div id="tap-landscape-gate" aria-live="polite" role="button" tabindex="0" aria-label="화면을 한 번 눌러 계속하기">
    <div class="gate-lead">여기서부터는 잠깐만요</div>
    <div class="sub">모바일 브라우저에서는 이런 식으로 한 번만 눌러 주셔야 이어지는 경우가 많아요. 앱 설치 없이 웹으로 쓸 때 흔한 절차라서, 화면이 이상한 게 아니라 그냥 이렇게 동작하는 거예요.</div>
    <div class="gate-tap-hint">화면 아무 곳이나 한 번 터치해 주세요</div>
  </div>
  <script>
    var qs = location.search || "";
    var useCss90Portrait = !/[?&]css90=0(?:&|$)/.test(qs);
    var skipLandscapeGate = /[?&]nogate=1(?:&|$)/.test(qs);
    if (/[?&]rot=90(?:&|$)/.test(qs)) {
      document.documentElement.style.setProperty("--unity-rot", "90deg");
    }

    var buildUrl = "Build";
    var loaderUrl = buildUrl + "/Re_Web_59.loader.js";

    var dpr = window.devicePixelRatio || 1;
    if (dpr > 2) dpr = 2;

    var config = {
      dataUrl: buildUrl + "/Re_Web_59.data",
      frameworkUrl: buildUrl + "/Re_Web_59.framework.js",
      codeUrl: buildUrl + "/Re_Web_59.wasm",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "DefaultCompany",
      productName: "모아채움",
      productVersion: "1.0",
      matchWebGLToCanvasSize: true,
      devicePixelRatio: dpr
    };

    var canvas = document.querySelector("#unity-canvas");
    var hint = document.querySelector("#rotate-hint");
    var rotateWrap = document.querySelector("#unity-rotate-wrap");
    var gate = document.querySelector("#tap-landscape-gate");

    var landscapeGateDismissed = false;
    var gateFsBusy = false;
    var unityInstanceRef = null;

    function isPortraitViewport() {
      return window.innerHeight > window.innerWidth;
    }

    var resizeTimer = null;
    function notifyUnityResizeSoon() {
      if (resizeTimer) clearTimeout(resizeTimer);
      resizeTimer = setTimeout(function () {
        resizeTimer = null;
        window.dispatchEvent(new Event("resize"));
        try {
          if (unityInstanceRef && unityInstanceRef.Module && unityInstanceRef.Module.canvas === canvas) {
            if (typeof unityInstanceRef.Module.SetCanvasSize === "function") {
              var r = canvas.getBoundingClientRect();
              var w = Math.max(1, Math.floor(r.width));
              var h = Math.max(1, Math.floor(r.height));
              unityInstanceRef.Module.SetCanvasSize(w, h, false);
            }
          }
        } catch (e) {}
      }, 80);
    }

    function syncCanvas16InsideWrap() {
      if (!rotateWrap || !canvas) return;
      if (!document.body.classList.contains("layout-css90")) {
        canvas.style.width = "";
        canvas.style.height = "";
        canvas.style.maxWidth = "";
        canvas.style.maxHeight = "";
        return;
      }
      var ww = rotateWrap.clientWidth;
      var wh = rotateWrap.clientHeight;
      if (ww < 2 || wh < 2) return;
      var ar = 16 / 9;
      var cw;
      var ch;
      if (ww / wh > ar) {
        ch = wh;
        cw = Math.floor(ch * ar);
      } else {
        cw = ww;
        ch = Math.floor(cw / ar);
      }
      canvas.style.width = cw + "px";
      canvas.style.height = ch + "px";
      canvas.style.maxWidth = "100%";
      canvas.style.maxHeight = "100%";
    }

    function applyCss90Metrics() {
      if (!rotateWrap) return;
      if (!document.body.classList.contains("layout-css90")) {
        rotateWrap.style.width = "";
        rotateWrap.style.height = "";
        syncCanvas16InsideWrap();
        return;
      }
      var iw = window.innerWidth;
      var ih = window.innerHeight;
      rotateWrap.style.width = ih + "px";
      rotateWrap.style.height = iw + "px";
      syncCanvas16InsideWrap();
      notifyUnityResizeSoon();
    }

    function syncCss90Layout() {
      if (useCss90Portrait && isPortraitViewport()) {
        document.body.classList.add("layout-css90");
      } else {
        document.body.classList.remove("layout-css90");
      }
      applyCss90Metrics();
      updateRotateHint();
      updateLandscapeGateVisibility();
    }

    function updateRotateHint() {
      if (!hint) return;
      if (document.body.classList.contains("layout-css90")) {
        hint.style.display = "none";
        return;
      }
      hint.style.display = isPortraitViewport() ? "block" : "none";
    }

    function isDocFullscreen() {
      return !!(
        document.fullscreenElement ||
        document.webkitFullscreenElement ||
        document.msFullscreenElement
      );
    }

    function updateLandscapeGateVisibility() {
      if (!gate) return;
      if (skipLandscapeGate || landscapeGateDismissed) {
        gate.classList.remove("visible");
        if (rotateWrap) rotateWrap.style.pointerEvents = "";
        if (canvas) canvas.style.pointerEvents = "";
        return;
      }
      if (isPortraitViewport() && !isDocFullscreen()) {
        gate.classList.add("visible");
        if (rotateWrap) rotateWrap.style.pointerEvents = "none";
        if (canvas) canvas.style.pointerEvents = "none";
      } else {
        gate.classList.remove("visible");
        if (rotateWrap) rotateWrap.style.pointerEvents = "";
        if (canvas) canvas.style.pointerEvents = "";
      }
    }

    function requestFs(el) {
      var e = el || document.documentElement;
      if (e.requestFullscreen) return e.requestFullscreen();
      if (e.webkitRequestFullscreen) return e.webkitRequestFullscreen();
      if (e.msRequestFullscreen) return e.msRequestFullscreen();
      return Promise.reject(new Error("no fullscreen"));
    }

    function tryLockLandscapeAfterFs() {
      var o = screen.orientation || screen.mozOrientation;
      if (!o || !o.lock) return Promise.resolve();
      return o.lock("landscape-primary").catch(function () {
        return o.lock("landscape").catch(function () {});
      });
    }

    function tryEnterLandscapeFromGate() {
      if (gateFsBusy) return;
      gateFsBusy = true;
      requestFs(document.documentElement).then(function () {
        return tryLockLandscapeAfterFs();
      }).then(function () {
        landscapeGateDismissed = true;
        gate.classList.remove("visible");
        if (rotateWrap) rotateWrap.style.pointerEvents = "";
        if (canvas) canvas.style.pointerEvents = "";
        syncCss90Layout();
        notifyUnityResizeSoon();
      }).catch(function () {
        landscapeGateDismissed = true;
        gate.classList.remove("visible");
        if (rotateWrap) rotateWrap.style.pointerEvents = "";
        if (canvas) canvas.style.pointerEvents = "";
        syncCss90Layout();
        notifyUnityResizeSoon();
      }).then(function () {
        setTimeout(function () { gateFsBusy = false; }, 700);
      });
    }

    if (gate) {
      gate.addEventListener("click", function (ev) {
        ev.preventDefault();
        ev.stopPropagation();
        tryEnterLandscapeFromGate();
      });
      gate.addEventListener("touchend", function (ev) {
        ev.preventDefault();
        ev.stopPropagation();
        tryEnterLandscapeFromGate();
      }, { passive: false });
      gate.addEventListener("keydown", function (ev) {
        if (ev.key === "Enter" || ev.key === " ") {
          ev.preventDefault();
          tryEnterLandscapeFromGate();
        }
      });
    }

    function onFsChange() {
      syncCss90Layout();
      notifyUnityResizeSoon();
    }
    document.addEventListener("fullscreenchange", onFsChange);
    document.addEventListener("webkitfullscreenchange", onFsChange);

    syncCss90Layout();
    window.addEventListener("resize", syncCss90Layout);
    window.addEventListener("orientationchange", function () {
      setTimeout(syncCss90Layout, 200);
    });
    if (window.visualViewport) {
      window.visualViewport.addEventListener("resize", syncCss90Layout);
    }

    function tryLockLandscape() {
      if (document.body.classList.contains("layout-css90")) return;
      var o = screen.orientation;
      if (o && o.lock) {
        o.lock("landscape").catch(function () {});
      }
    }

    var script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = function () {
      createUnityInstance(canvas, config, function () {}).then(function (unityInstance) {
        unityInstanceRef = unityInstance;
        updateLandscapeGateVisibility();

        var fixFocus = function () {
          tryLockLandscape();
          applyCss90Metrics();
          notifyUnityResizeSoon();
        };
        canvas.addEventListener("touchstart", fixFocus, { passive: true });
        canvas.addEventListener("mousedown", fixFocus);
        if (typeof ResizeObserver !== "undefined" && rotateWrap) {
          var ro = new ResizeObserver(function () {
            syncCanvas16InsideWrap();
            notifyUnityResizeSoon();
          });
          ro.observe(rotateWrap);
          ro.observe(canvas);
        }
      }).catch(function (message) {
        alert(message);
      });
    };
    script.onerror = function () {
      alert("WebGL 로더를 불러오지 못했습니다. Build 폴더와 빌드 산출물 여부를 확인하세요.");
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
