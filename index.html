<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>모아채움</title>
  <!-- Unity WebGL 빌드 시 템플릿 매크로만 치환됩니다. 주석에 삼중중괄호 매크로 문법을 넣지 마세요. -->
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      position: fixed;
      left: 0;
      top: 0;
      background: #7f88cb;
      touch-action: none;
      -webkit-touch-callout: none;
    }
    #webgl-loading {
      position: fixed;
      inset: 0;
      z-index: 2147482000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 24px;
      box-sizing: border-box;
      background: linear-gradient(180deg, #1a1a22 0%, #0d0d12 100%);
      color: #e8e8f0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
      text-align: center;
      pointer-events: none;
    }
    #webgl-loading.hidden {
      display: none;
    }
    #webgl-loading .title {
      font-size: 1.05rem;
      font-weight: 600;
      line-height: 1.5;
      max-width: 22em;
    }
    #webgl-loading .hint {
      font-size: 0.9rem;
      opacity: 0.75;
      max-width: 24em;
      line-height: 1.45;
    }
    #webgl-loading .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255,255,255,0.15);
      border-top-color: #8b9cff;
      border-radius: 50%;
      animation: webgl-spin 0.85s linear infinite;
    }
    @keyframes webgl-spin {
      to { transform: rotate(360deg); }
    }
    #unity-rotate-wrap {
      width: 100%;
      height: 100%;
      position: fixed;
      left: 0;
      top: 0;
      touch-action: none;
      pointer-events: auto;
      -webkit-tap-highlight-color: transparent;
    }
    #unity-container {
      width: 100%;
      height: 100%;
      position: fixed;
      left: 0;
      top: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
      pointer-events: auto;
    }
    #unity-canvas {
      display: block;
      touch-action: manipulation;
      outline: none;
      pointer-events: auto;
      width: 100%;
      height: 100%;
      max-width: none;
      max-height: none;
    }
    /* 세로: 회전은 canvas 부모(#unity-container)만 — 바깥 래퍼 transform은 WebGL 포인터/TMP 좌표 깨짐의 흔한 원인 */
    body.layout-css90 #unity-rotate-wrap {
      position: fixed;
      left: 0;
      top: 0;
      right: auto;
      bottom: auto;
      width: 100%;
      height: 100%;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transform: none;
      transform-origin: center center;
      will-change: auto;
      pointer-events: auto;
    }
    body.layout-css90 #unity-container {
      /* 세로 뷰에서 회전 전 논리 가로 박스 = 뷰포트 긴변×짧은변. %/auto는 flex·초기 캔버스에 끌려 과소됨 → dvh/dvw로 고정 */
      position: relative;
      left: auto;
      top: auto;
      width: 100dvh;
      height: 100dvw;
      min-width: 100dvh;
      min-height: 100dvw;
      max-width: 100dvh;
      max-height: 100dvw;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
      transform: translateZ(0) rotate(var(--unity-rot, -90deg));
      transform-origin: center center;
      pointer-events: auto;
    }
    body.layout-css90 #unity-canvas {
      box-sizing: border-box;
      pointer-events: auto;
    }
    body.layout-css90 {
      touch-action: manipulation;
    }
    #rotate-hint {
      display: none;
      position: fixed;
      left: 0;
      right: 0;
      bottom: 12px;
      text-align: center;
      font-family: system-ui, sans-serif;
      font-size: 14px;
      color: rgba(255,255,255,0.85);
      pointer-events: none;
      z-index: 1;
    }
    body.layout-css90 #rotate-hint {
      display: none;
    }
  </style>
</head>
<body>
  <div id="webgl-loading" aria-live="polite">
    <div class="spinner" aria-hidden="true"></div>
    <div class="title">프로그램을 불러오는 중입니다.<br>잠시만 기다려 주세요.</div>
    <div class="hint">첫 화면이 찌그러져 보이면, 다른 앱으로 잠시 나갔다 오거나 화면을 한 번 터치해 보세요.</div>
  </div>
  <div id="unity-rotate-wrap">
    <div id="unity-container">
      <canvas id="unity-canvas" tabindex="0"></canvas>
    </div>
  </div>
  <div id="rotate-hint">가로로 보려면 기기를 가로로 돌려 주세요</div>
  <script>
    var qs = location.search || "";
    // 기본값은 비회전(안정 경로). 회전 실험이 필요할 때만 ?css90=1 로 활성화.
    var useCss90Portrait = /[?&]css90=1(?:&|$)/.test(qs);
    // 회전값은 고정(-90deg)으로 유지한다. (좌/우 90도 반복 변경 방지)

    var buildUrl = "Build";
    var loaderUrl = buildUrl + "/Re_Web_59.loader.js";

    var dpr = window.devicePixelRatio || 1;
    if (dpr > 2) dpr = 2;

    var config = {
      dataUrl: buildUrl + "/Re_Web_59.data",
      frameworkUrl: buildUrl + "/Re_Web_59.framework.js",
      codeUrl: buildUrl + "/Re_Web_59.wasm",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "DefaultCompany",
      productName: "모아채움",
      productVersion: "1.0",
      // true: CSS 캔버스 표시 크기에 맞춰 버퍼 동기(수동 width/height와 이중 적용 시 깨짐 방지)
      matchWebGLToCanvasSize: true,
      devicePixelRatio: dpr
    };

    var canvas = document.querySelector("#unity-canvas");
    var hint = document.querySelector("#rotate-hint");
    var rotateWrap = document.querySelector("#unity-rotate-wrap");
    var unityContainer = document.querySelector("#unity-container");
    var loadingEl = document.querySelector("#webgl-loading");
    var unityInstanceRef = null;
    var fullscreenLandscapeAttempted = false;
    var TARGET_ASPECT = 16 / 9;

    /** 주소창/툴바로 inner*가 흔들릴 때 대비 (없으면 inner 사용) */
    function readViewportCssPixels() {
      var vv = window.visualViewport;
      if (vv && vv.width >= 32 && vv.height >= 32) {
        return { w: Math.round(vv.width), h: Math.round(vv.height) };
      }
      return {
        w: Math.round(window.innerWidth || document.documentElement.clientWidth || 0),
        h: Math.round(window.innerHeight || document.documentElement.clientHeight || 0)
      };
    }

    function hideLoadingOverlay() {
      if (loadingEl) loadingEl.classList.add("hidden");
    }

    function isPortraitViewport() {
      var vp = readViewportCssPixels();
      return vp.h > vp.w;
    }

    var resizeTimer = null;
    function notifyUnityResizeSoon() {
      if (resizeTimer) clearTimeout(resizeTimer);
      resizeTimer = setTimeout(function () {
        resizeTimer = null;
        window.dispatchEvent(new Event("resize"));
      }, 80);
    }

    function bumpLayout(reason) {
      syncCss90Layout();
      notifyUnityResizeSoon();
      setTimeout(function () {
        syncCss90Layout();
        notifyUnityResizeSoon();
      }, 120);
      setTimeout(function () {
        syncCss90Layout();
        notifyUnityResizeSoon();
      }, 400);
    }

    function getAspectFittedSize(containerW, containerH, targetAspect) {
      if (containerW <= 0 || containerH <= 0) {
        return { width: 0, height: 0 };
      }
      var width = containerW;
      var height = width / targetAspect;
      if (height > containerH) {
        height = containerH;
        width = height * targetAspect;
      }
      return {
        width: Math.max(1, Math.round(width)),
        height: Math.max(1, Math.round(height))
      };
    }

    function syncCanvas16InsideWrap() {
      if (!rotateWrap || !canvas) return;
      var wrapW;
      var wrapH;
      if (document.body.classList.contains("layout-css90")) {
        var vp = readViewportCssPixels();
        var iw = vp.w;
        var ih = vp.h;
        if (ih < iw) {
          var t = ih;
          ih = iw;
          iw = t;
        }
        wrapW = ih;
        wrapH = iw;
      } else {
        var sizeBox = rotateWrap;
        wrapW = sizeBox.clientWidth || window.innerWidth || 0;
        wrapH = sizeBox.clientHeight || window.innerHeight || 0;
      }
      var fitted = getAspectFittedSize(wrapW, wrapH, TARGET_ASPECT);
      canvas.style.width = fitted.width + "px";
      canvas.style.height = fitted.height + "px";
      canvas.style.maxWidth = "none";
      canvas.style.maxHeight = "none";
    }

    function applyCss90Metrics() {
      if (!rotateWrap) return;
      var vp = readViewportCssPixels();
      var iw = vp.w;
      var ih = vp.h;
      if (!document.body.classList.contains("layout-css90")) {
        rotateWrap.style.width = iw + "px";
        rotateWrap.style.height = ih + "px";
        if (unityContainer) {
          unityContainer.style.width = "";
          unityContainer.style.height = "";
          unityContainer.style.minWidth = "";
          unityContainer.style.minHeight = "";
          unityContainer.style.maxWidth = "";
          unityContainer.style.maxHeight = "";
        }
        syncCanvas16InsideWrap();
        return;
      }
      rotateWrap.style.width = "100%";
      rotateWrap.style.height = "100%";
      if (unityContainer) {
        /* dvh/dvw 미지원 브라우저용 폴백 */
        if (typeof CSS === "undefined" || !CSS.supports || !CSS.supports("width", "100dvh")) {
          if (ih < iw) {
            var tmp = ih;
            ih = iw;
            iw = tmp;
          }
          unityContainer.style.width = ih + "px";
          unityContainer.style.height = iw + "px";
        } else {
          unityContainer.style.width = "";
          unityContainer.style.height = "";
          unityContainer.style.minWidth = "";
          unityContainer.style.minHeight = "";
          unityContainer.style.maxWidth = "";
          unityContainer.style.maxHeight = "";
        }
      }
      syncCanvas16InsideWrap();
      notifyUnityResizeSoon();
    }

    function syncCss90Layout() {
      if (useCss90Portrait && isPortraitViewport()) {
        document.body.classList.add("layout-css90");
      } else {
        document.body.classList.remove("layout-css90");
      }
      applyCss90Metrics();
      updateRotateHint();
    }

    function updateRotateHint() {
      if (!hint) return;
      if (document.body.classList.contains("layout-css90")) {
        hint.style.display = "none";
        return;
      }
      hint.style.display = isPortraitViewport() ? "block" : "none";
    }

    document.addEventListener("visibilitychange", function () {
      if (!document.hidden) bumpLayout("visible");
    });
    window.addEventListener("pageshow", function () {
      bumpLayout("pageshow");
    });
    window.addEventListener("focus", function () {
      bumpLayout("focus");
    });

    document.addEventListener("pointerdown", function onFirstTouch() {
      bumpLayout("first-touch");
    }, { passive: true, capture: true, once: true });

    syncCss90Layout();
    window.addEventListener("resize", syncCss90Layout);
    window.addEventListener("orientationchange", function () {
      setTimeout(syncCss90Layout, 200);
      setTimeout(bumpLayout, 350);
    });
    if (window.visualViewport) {
      window.visualViewport.addEventListener("resize", function () {
        syncCss90Layout();
        notifyUnityResizeSoon();
      });
    }

    requestAnimationFrame(function () {
      syncCss90Layout();
      notifyUnityResizeSoon();
      requestAnimationFrame(function () {
        syncCss90Layout();
        notifyUnityResizeSoon();
      });
    });

    var script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = function () {
      createUnityInstance(canvas, config, function () {}).then(function (unityInstance) {
        unityInstanceRef = unityInstance;
        hideLoadingOverlay();
        bumpLayout("unity-ready");
        [600, 1400, 2800].forEach(function (ms) {
          setTimeout(function () { bumpLayout("delayed-" + ms); }, ms);
        });

        // touchstart에서 canvas/window에 포커스를 주면, 같은 제스처로 TMP가 연 브라우저 숨김 input의
        // 포커스를 뺏어 모바일 소프트 키보드가 안 뜨는 경우가 많음. 레이아웃만 동기화한다.
        var syncLayoutFromCanvasPointer = function () {
          applyCss90Metrics();
          notifyUnityResizeSoon();
        };
        canvas.addEventListener("touchstart", syncLayoutFromCanvasPointer, { passive: true });
        canvas.addEventListener("mousedown", syncLayoutFromCanvasPointer);
        if (typeof ResizeObserver !== "undefined" && rotateWrap) {
          var ro = new ResizeObserver(function () {
            syncCanvas16InsideWrap();
            notifyUnityResizeSoon();
          });
          ro.observe(rotateWrap);
          if (unityContainer) ro.observe(unityContainer);
          ro.observe(canvas);
        }
      }).catch(function (message) {
        hideLoadingOverlay();
        alert(message);
      });
    };
    script.onerror = function () {
      hideLoadingOverlay();
      alert("WebGL 로더를 불러오지 못했습니다. Build 폴더와 빌드 산출물 여부를 확인하세요.");
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
